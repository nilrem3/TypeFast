<app-pretestquestions
*ngIf="appMode === 'PreTestQuestions'"
(beginClicked)="onBeginClicked()"
></app-pretestquestions>

<app-typer
[familiar]="familiarTest === 'Test1'"
[music]="nomusicTest !== 'Test1'"
*ngIf="appMode === 'Test1'"
(focusFunctionReady)="onFocusFunctionReady($event)"
(testNextButtonPressed)="onTestNextPressed($event)"
></app-typer>

<app-typer
[familiar]="familiarTest === 'Test2'"
[music]="nomusicTest !== 'Test2'"
*ngIf="appMode === 'Test2'"
(focusFunctionReady)="onFocusFunctionReady($event)"
(testNextButtonPressed)="onTestNextPressed($event)"
></app-typer>

<app-typer
[familiar]="familiarTest === 'Test3'"

<app-posttestquestions
*ngIf="appMode === 'PostTestQuestions'"
(submitClicked)="onSubmitClicked()"
></app-posttestquestions>
<app-handoffprompt
*ngIf="appMode === 'HandoffPrompt'"
(nextClicked)="onNextClicked()"
></app-handoffprompt>

<app-datasave *ngIf="appMode === 'ResearcherFileSelect'"></app-datasave>
